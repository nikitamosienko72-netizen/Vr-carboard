<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>VR Browser</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#06060f;color:#fff;font-family:system-ui,sans-serif;overflow:hidden;touch-action:none;user-select:none;}
#setup{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:32px;background:#06060f;z-index:999;}
#setup h1{font-size:26px;font-weight:500;color:#c7d2fe;}
#setup p{font-size:13px;color:#6666aa;text-align:center;max-width:300px;line-height:1.7;}
.sbtn{display:block;width:100%;max-width:280px;padding:15px;text-align:center;border-radius:14px;font-size:15px;cursor:pointer;border:none;-webkit-appearance:none;font-family:system-ui,sans-serif;}
.sbtn.primary{background:#3b82f6;color:#fff;}
.sbtn.secondary{background:#ffffff0f;color:#8888cc;margin-top:4px;font-size:13px;}
#app{position:fixed;inset:0;display:none;}
canvas{position:absolute;top:0;left:0;width:100%;height:100%;}
#hcv{z-index:5;pointer-events:none;}
#cursor{position:absolute;width:30px;height:30px;margin-left:-15px;margin-top:-15px;z-index:10;pointer-events:none;}
#cursor svg{width:100%;height:100%;}
#notif{position:absolute;top:20px;left:50%;transform:translateX(-50%);background:#000000cc;border:1px solid #3b82f660;border-radius:10px;padding:8px 20px;font-size:13px;color:#60a5fa;z-index:20;pointer-events:none;white-space:nowrap;opacity:0;transition:opacity .3s;}
</style>
</head>
<body>

<div id="setup">
  <div style="font-size:52px;">🥽</div>
  <h1>VR Browser</h1>
  <p>Проведіть пальцем — рух курсору<br>Відпустіть — клік<br>Затримайте — авто-клік</p>
  <button class="sbtn primary" onclick="startApp(false)">📷 Запустити з камерою</button>
  <button class="sbtn secondary" onclick="startApp(true)">▶ Демо-режим (без камери)</button>
</div>

<div id="app">
  <canvas id="mcv"></canvas>
  <canvas id="hcv"></canvas>
  <div id="cursor">
    <svg viewBox="0 0 30 30">
      <circle cx="15" cy="15" r="12" fill="none" stroke="rgba(255,255,255,0.8)" stroke-width="2"/>
      <circle cx="15" cy="15" r="4" fill="white"/>
      <circle id="dwell-ring" cx="15" cy="15" r="12" fill="none" stroke="#60a5fa" stroke-width="2.5"
        stroke-dasharray="75" stroke-dashoffset="75" stroke-linecap="round" transform="rotate(-90 15 15)"/>
    </svg>
  </div>
  <div id="notif"></div>
</div>

<video id="vid" autoplay playsinline muted style="display:none;"></video>

<script>
var W=window.innerWidth, H=window.innerHeight;
var cx=0.5, cy=0.5;
var view='menu';
var urlInput='https://';
var dwellKey=null, dwellVal=0;
var frame=0;
var camActive=false, demoMode=false;
var handBox=null, handPts=[], gesture='none';
var demoAngle=0;
var notifTimer=0;
var tmpCv=null, tmpCtx=null, vid=null;
var dragActive=false, dragStartX=0, dragStartY=0, dragStartCX=0.5, dragStartCY=0.5;
var mCtx=null, hCtx=null;

var MENU=[
  {icon:'▶',label:'YouTube',url:'https://www.youtube.com/tv#'},
  {icon:'🌐',label:'Браузер',url:null},
  {icon:'📰',label:'Новини',url:'https://news.google.com'},
  {icon:'🗺',label:'Карти',url:'https://maps.google.com'},
  {icon:'🎮',label:'Ігри',url:'https://html5games.com'},
  {icon:'🎵',label:'Музика',url:'https://music.youtube.com'},
];

var KROWS=[
  ['1','2','3','4','5','6','7','8','9','0'],
  ['q','w','e','r','t','y','u','i','o','p'],
  ['a','s','d','f','g','h','j','k','l','.'],
  ['z','x','c','v','b','n','m','/','_','⌫'],
  ['https://','www.','.com','GO','✕'],
];

function startApp(demo) {
  demoMode=demo;
  document.getElementById('setup').style.display='none';
  document.getElementById('app').style.display='block';
  var mc=document.getElementById('mcv'), hc=document.getElementById('hcv');
  mc.width=hc.width=W; mc.height=hc.height=H;
  mCtx=mc.getContext('2d'); hCtx=hc.getContext('2d');
  window.addEventListener('resize',function(){W=window.innerWidth;H=window.innerHeight;mc.width=hc.width=W;mc.height=hc.height=H;});
  initTouch();
  if(!demo) startCamera();
  requestAnimationFrame(loop);
}

function startCamera() {
  vid=document.getElementById('vid');
  navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:320,height:240}})
    .then(function(s){vid.srcObject=s;camActive=true;showNotif('📷 Камера увімкнена');})
    .catch(function(){demoMode=true;showNotif('Камера недоступна — демо');});
}

function initTouch() {
  var el=document.getElementById('app');
  el.addEventListener('touchstart',function(e){e.preventDefault();var t=e.touches[0];dragActive=true;dragStartX=t.clientX;dragStartY=t.clientY;dragStartCX=cx;dragStartCY=cy;},{passive:false});
  el.addEventListener('touchmove',function(e){e.preventDefault();if(!dragActive)return;var t=e.touches[0];cx=Math.max(.01,Math.min(.99,dragStartCX+(t.clientX-dragStartX)/W*2.5));cy=Math.max(.01,Math.min(.99,dragStartCY+(t.clientY-dragStartY)/H*2.5));moveCursor();},{passive:false});
  el.addEventListener('touchend',function(e){e.preventDefault();dragActive=false;handleClick();},{passive:false});
  el.addEventListener('mousemove',function(e){cx=e.clientX/W;cy=e.clientY/H;moveCursor();});
  el.addEventListener('click',handleClick);
}

function moveCursor(){var c=document.getElementById('cursor');c.style.left=Math.round(cx*W)+'px';c.style.top=Math.round(cy*H)+'px';}

function handleClick(){if(view==='menu')clickMenu();else clickKb();}

function getML(){var iW=Math.min(108,W*.28),iH=iW*.72,gap=Math.min(12,W*.025),cols=3,rows=2,tW=cols*iW+(cols-1)*gap,tH=rows*iH+(rows-1)*gap;return{iW,iH,gap,cols,tW,tH,sx:W/2-tW/2,sy:H/2-tH/2-H*.04};}
function getMIP(i,ml){return{x:ml.sx+(i%ml.cols)*(ml.iW+ml.gap),y:ml.sy+Math.floor(i/ml.cols)*(ml.iH+ml.gap)};}
function getKL(){return{kH:Math.min(38,H*.075),gap:3,startY:H*.3};}
function getKP(ri,ki,row,kl){var kW=(W-20-(row.length-1)*kl.gap)/row.length;return{x:10+ki*(kW+kl.gap),y:kl.startY+ri*(kl.kH+kl.gap),w:kW};}

function clickMenu(){var ml=getML(),gx=cx*W,gy=cy*H;for(var i=0;i<MENU.length;i++){var p=getMIP(i,ml);if(gx>=p.x&&gx<=p.x+ml.iW&&gy>=p.y&&gy<=p.y+ml.iH){doMenu(i);return;}}}
function doMenu(i){var item=MENU[i];if(item.url){showNotif('Відкриваю: '+item.label);setTimeout(function(){window.location.href=item.url;},400);}else if(item.label==='Браузер'){view='keyboard';showNotif('Введіть URL');}}
function clickKb(){var kl=getKL(),gx=cx*W,gy=cy*H;if(gy<H*.24){view='menu';showNotif('Меню');return;}for(var ri=0;ri<KROWS.length;ri++){var row=KROWS[ri];for(var ki=0;ki<row.length;ki++){var p=getKP(ri,ki,row,kl);if(gx>=p.x&&gx<=p.x+p.w&&gy>=p.y&&gy<=p.y+kl.kH){doKey(row[ki]);return;}}}}
function doKey(k){if(k==='⌫')urlInput=urlInput.slice(0,-1);else if(k==='GO'){showNotif('Відкриваю...');setTimeout(function(){window.location.href=urlInput.startsWith('http')?urlInput:'https://'+urlInput;},400);}else if(k==='✕'){view='menu';showNotif('Меню');}else urlInput+=k;}

function processHand(){
  if(camActive&&vid&&vid.readyState>=2){
    if(!tmpCv){tmpCv=document.createElement('canvas');tmpCv.width=160;tmpCv.height=120;tmpCtx=tmpCv.getContext('2d');}
    tmpCtx.drawImage(vid,0,0,160,120);
    var id=tmpCtx.getImageData(0,0,160,120);
    handPts=detectSkin(id.data,160,120);
    handBox=handPts.length>80?bbox(handPts):null;
    if(handBox){var r=handBox.w/Math.max(handBox.h,1);gesture=r>.55&&handPts.length>280?'open':handPts.length<180?'fist':'pinch';}else gesture='none';
  } else if(demoMode){
    demoAngle+=.022;
    var dcx=.5+Math.sin(demoAngle*.7)*.18,dcy=.5+Math.cos(demoAngle*.5)*.13;
    handBox={x0:dcx-.1,y0:dcy-.14,x1:dcx+.1,y1:dcy+.1,w:.2,h:.24,cx:dcx,cy:dcy};
    handPts=[];for(var i=0;i<18;i++)handPts.push({x:dcx+(Math.random()-.5)*.2,y:dcy+(Math.random()-.5)*.18});
    gesture=['open','fist','pinch'][Math.floor(demoAngle/3)%3];
  }
}
function detectSkin(d,w,h){var pts=[];for(var y=0;y<h;y+=2)for(var x=0;x<w;x+=2){var i=(y*w+x)*4,r=d[i],g=d[i+1],b=d[i+2];if(r>95&&g>40&&b>20&&r>g&&r>b&&r-Math.min(g,b)>15&&Math.abs(r-g)>15)pts.push({x:x/w,y:y/h});}return pts;}
function bbox(pts){var x0=1,y0=1,x1=0,y1=0;for(var i=0;i<pts.length;i++){var p=pts[i];x0=Math.min(x0,p.x);y0=Math.min(y0,p.y);x1=Math.max(x1,p.x);y1=Math.max(y1,p.y);}return{x0,y0,x1,y1,w:x1-x0,h:y1-y0,cx:(x0+x1)/2,cy:(y0+y1)/2};}

function checkDwell(key,hit){if(hit){if(dwellKey!==key){dwellKey=key;dwellVal=0;}else dwellVal=Math.min(dwellVal+1/85,1);if(dwellVal>=1){dwellVal=0;dwellKey=null;return true;}}else if(dwellKey===key){dwellKey=null;dwellVal=0;}return false;}

function loop(){frame++;processHand();drawScene();drawHand();document.getElementById('dwell-ring').style.strokeDashoffset=75*(1-dwellVal);if(notifTimer>0)notifTimer--;if(notifTimer===0)document.getElementById('notif').style.opacity=0;requestAnimationFrame(loop);}

function drawScene(){
  mCtx.fillStyle='#06060f';mCtx.fillRect(0,0,W,H);
  mCtx.fillStyle='#ffffff12';for(var i=0;i<70;i++){mCtx.beginPath();mCtx.arc(((i*137)%1000)/1000*W,((i*251)%1000)/1000*H,i%5===0?1.2:.55,0,Math.PI*2);mCtx.fill();}
  mCtx.strokeStyle='#3b82f60c';mCtx.lineWidth=1;
  for(var i=0;i<8;i++){var y=H*.6+i*H*.055;mCtx.beginPath();mCtx.moveTo(0,y);mCtx.lineTo(W,y);mCtx.stroke();}
  for(var i=-5;i<=5;i++){var x=W/2+i*W*.12;mCtx.beginPath();mCtx.moveTo(x,H*.6);mCtx.lineTo(W/2+i*W*2,H*1.3);mCtx.stroke();}
  mCtx.strokeStyle='#3b82f625';mCtx.lineWidth=.5;mCtx.beginPath();mCtx.moveTo(0,H*.6);mCtx.lineTo(W,H*.6);mCtx.stroke();
  if(view==='menu')drawMenu();else drawKb();
  var vg=mCtx.createRadialGradient(W/2,H/2,H*.1,W/2,H/2,H*.75);vg.addColorStop(0,'transparent');vg.addColorStop(1,'rgba(0,0,0,.55)');mCtx.fillStyle=vg;mCtx.fillRect(0,0,W,H);
}

function drawMenu(){
  var ml=getML();
  mCtx.fillStyle='rgba(8,8,24,.9)';rr(ml.sx-18,ml.sy-52,ml.tW+36,ml.tH+86,16);mCtx.fill();
  mCtx.strokeStyle='#3b82f645';mCtx.lineWidth=1;rr(ml.sx-18,ml.sy-52,ml.tW+36,ml.tH+86,16);mCtx.stroke();
  mCtx.fillStyle='#c7d2fe';mCtx.font='500 15px system-ui';mCtx.textAlign='center';mCtx.fillText('VR Меню',W/2,ml.sy-26);mCtx.textAlign='left';
  var gx=cx*W,gy=cy*H;
  for(var i=0;i<MENU.length;i++){
    var p=getMIP(i,ml),x=p.x,y=p.y,iW=ml.iW,iH=ml.iH;
    var hov=gx>=x&&gx<=x+iW&&gy>=y&&gy<=y+iH;
    if(checkDwell('m'+i,hov))doMenu(i);
    var dp=dwellKey==='m'+i?dwellVal:0;
    mCtx.fillStyle=hov?'rgba(59,130,246,.28)':'rgba(255,255,255,.06)';rr(x,y,iW,iH,10);mCtx.fill();
    mCtx.strokeStyle=hov?'#3b82f6':'#ffffff18';mCtx.lineWidth=hov?1.5:.5;rr(x,y,iW,iH,10);mCtx.stroke();
    if(dp>0){mCtx.strokeStyle='#60a5fa';mCtx.lineWidth=2.5;mCtx.beginPath();mCtx.arc(x+iW/2,y+iH/2,Math.min(iW,iH)*.36,-Math.PI/2,-Math.PI/2+dp*Math.PI*2);mCtx.stroke();}
    mCtx.font='22px system-ui';mCtx.textAlign='center';mCtx.fillStyle=hov?'#93c5fd':'#dde';mCtx.fillText(MENU[i].icon,x+iW/2,y+iH/2+6);
    mCtx.font=(hov?'500 ':'')+'11px system-ui';mCtx.fillStyle=hov?'#bfdbfe':'#8888aa';mCtx.fillText(MENU[i].label,x+iW/2,y+iH-10);mCtx.textAlign='left';
  }
  mCtx.fillStyle='#333';mCtx.font='10px system-ui';mCtx.textAlign='center';
  mCtx.fillText('Проведіть пальцем = рух  |  Відпустіть = клік  |  Затримайте = авто-клік',W/2,ml.sy+ml.tH+26);mCtx.textAlign='left';
}

function drawKb(){
  var kl=getKL();
  mCtx.fillStyle='rgba(0,0,0,.7)';rr(10,H*.12,W-20,H*.1,10);mCtx.fill();
  mCtx.strokeStyle='#3b82f660';mCtx.lineWidth=1;rr(10,H*.12,W-20,H*.1,10);mCtx.stroke();
  mCtx.fillStyle='#60a5fa';mCtx.font='13px system-ui';
  var show=urlInput.length>36?'…'+urlInput.slice(-34):urlInput;
  mCtx.fillText(show+(frame%60<30?'|':''),20,H*.12+H*.065);
  mCtx.fillStyle='#444';mCtx.font='10px system-ui';mCtx.textAlign='center';
  mCtx.fillText('↑ Торкніться тут щоб повернутись до меню',W/2,H*.26);mCtx.textAlign='left';
  var gx=cx*W,gy=cy*H;
  for(var ri=0;ri<KROWS.length;ri++){
    var row=KROWS[ri];
    for(var ki=0;ki<row.length;ki++){
      var p=getKP(ri,ki,row,kl),hov=gx>=p.x&&gx<=p.x+p.w&&gy>=p.y&&gy<=p.y+kl.kH,key=row[ki];
      if(checkDwell('k'+ri+ki,hov))doKey(key);
      var dp=dwellKey==='k'+ri+ki?dwellVal:0;
      mCtx.fillStyle=hov?'rgba(59,130,246,.3)':'rgba(255,255,255,.07)';rr(p.x,p.y,p.w,kl.kH,6);mCtx.fill();
      mCtx.strokeStyle=hov?'#3b82f6':'#ffffff14';mCtx.lineWidth=hov?1.5:.5;rr(p.x,p.y,p.w,kl.kH,6);mCtx.stroke();
      if(dp>0){mCtx.strokeStyle='#60a5fa';mCtx.lineWidth=2;mCtx.beginPath();mCtx.arc(p.x+p.w/2,p.y+kl.kH/2,kl.kH*.38,-Math.PI/2,-Math.PI/2+dp*Math.PI*2);mCtx.stroke();}
      mCtx.fillStyle=hov?'#93c5fd':'#dde';mCtx.font=(ri===4?'11':'12')+'px system-ui';mCtx.textAlign='center';
      mCtx.fillText(key,p.x+p.w/2,p.y+kl.kH*.68);mCtx.textAlign='left';
    }
  }
}

var FCOLS=['#ef4444','#f97316','#eab308','#22c55e','#3b82f6'];
function drawHand(){
  hCtx.clearRect(0,0,W,H);if(!handBox)return;
  var b=handBox,bx=b.cx*W,by=b.cy*H,bw=b.w*W*.5,bh=b.h*H*.5;
  var wrist={x:bx,y:by+bh*.65};
  var isOpen=gesture==='open',isFist=gesture==='fist';
  var pb=[{x:bx-bw*.55,y:by+bh*.18},{x:bx-bw*.2,y:by},{x:bx+bw*.1,y:by-bh*.05},{x:bx+bw*.4,y:by+bh*.05},{x:bx+bw*.62,y:by+bh*.32}];
  var t=frame*.035;
  var tips=pb.map(function(p,i){var sp=isOpen?1:isFist?.15:.55,dy=isFist?bh*.08:-bh*(.52+Math.sin(t+i*.4)*.04);return{x:p.x+(p.x-bx)*.35*sp,y:p.y+dy*sp};});
  pb.forEach(function(p,i){
    var tip=tips[i],mid={x:(p.x+tip.x)/2,y:(p.y+tip.y)/2};
    hCtx.strokeStyle=FCOLS[i];hCtx.lineWidth=2.5;hCtx.lineCap='round';hCtx.lineJoin='round';
    hCtx.beginPath();hCtx.moveTo(wrist.x,wrist.y);hCtx.lineTo(p.x,p.y);hCtx.lineTo(mid.x,mid.y);hCtx.lineTo(tip.x,tip.y);hCtx.stroke();
    [[wrist.x,wrist.y],[p.x,p.y],[mid.x,mid.y],[tip.x,tip.y]].forEach(function(j,ji){hCtx.fillStyle=ji===3?FCOLS[i]:'#fff';hCtx.beginPath();hCtx.arc(j[0],j[1],ji===3?4:3,0,Math.PI*2);hCtx.fill();});
  });
  hCtx.strokeStyle='rgba(255,255,255,.2)';hCtx.lineWidth=1;for(var i=0;i<pb.length-1;i++){hCtx.beginPath();hCtx.moveTo(pb[i].x,pb[i].y);hCtx.lineTo(pb[i+1].x,pb[i+1].y);hCtx.stroke();}
  if(!isFist){hCtx.strokeStyle='rgba(96,165,250,.5)';hCtx.lineWidth=1.5;hCtx.setLineDash([5,5]);hCtx.beginPath();hCtx.moveTo(tips[1].x,tips[1].y);hCtx.lineTo(cx*W,cy*H);hCtx.stroke();hCtx.setLineDash([]);}
  hCtx.fillStyle=gesture==='fist'?'#ef4444':gesture==='open'?'#4ade80':'#facc15';
  hCtx.font='11px system-ui';hCtx.fillText(gesture==='open'?'✋':gesture==='fist'?'✊':'🤏',b.x0*W,b.y0*H-8);
}

function rr(x,y,w,h,r){mCtx.beginPath();mCtx.moveTo(x+r,y);mCtx.lineTo(x+w-r,y);mCtx.quadraticCurveTo(x+w,y,x+w,y+r);mCtx.lineTo(x+w,y+h-r);mCtx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);mCtx.lineTo(x+r,y+h);mCtx.quadraticCurveTo(x,y+h,x,y+h-r);mCtx.lineTo(x,y+r);mCtx.quadraticCurveTo(x,y,x+r,y);mCtx.closePath();}
function showNotif(msg){var el=document.getElementById('notif');el.textContent=msg;el.style.opacity='1';notifTimer=120;}
</script>
</body>
</html>
